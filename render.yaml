services:
  - type: web
    name: delta-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/upstox/status
    envVars:
      # Upstox auto-login. Render asks for these when you create the Blueprint; never commit them.
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URI
        sync: false
      - key: UPSTOX_MOBILE
        sync: false
      - key: UPSTOX_PIN
        sync: false
      - key: UPSTOX_TOTP_SECRET
        sync: false
      # Hidden browser: tested working on Render and uses the least memory.
      - key: UPSTOX_HEADLESS
        value: "true"
